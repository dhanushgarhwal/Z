[workspace]
resolver = "2"
members = ["crates/zcore", "crates/z"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

# Size + speed tuned release profile (single static binary, no runtime to install)
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
