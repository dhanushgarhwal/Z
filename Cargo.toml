[workspace]
resolver = "2"
members = ["crates/zcore", "crates/z", "crates/setup"]
# `cargo build` builds the app; Z Setup embeds the release binaries, so it is built on its own: cargo build --release -p setup
default-members = ["crates/zcore", "crates/z"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

# Size + speed tuned release profile (single static binary, no runtime to install)
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
