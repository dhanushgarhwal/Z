[package]
name = "z"
description = "Z: free, open-source archiver"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "Z"                 # GUI: Z.exe (no console window)
path = "src/main.rs"

[[bin]]
name = "zc"                # console: zc.exe (scripts, CI, terminals)
path = "src/bin/zc.rs"

[dependencies]
zcore  = { path = "../zcore" }
anyhow = "1"
# Lean GUI stack: OpenGL backend, no bundled fonts (we ship our own 22 KB font), no accesskit/web.
eframe       = { version = "0.29", default-features = false, features = ["glow"] }
egui_extras  = { version = "0.29", default-features = false }
rfd          = "0.15"

[features]
default = []
rar = ["zcore/rar"]

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
