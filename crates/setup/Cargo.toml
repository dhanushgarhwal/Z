[package]
name = "setup"
description = "Z Setup: installer for Z"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "Z-Setup"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.29", default-features = false, features = ["glow"] }
rfd    = "0.15"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
