[package]
name = "zcore"
description = "Z archive engine: detect, list, extract, create, test"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow    = "1"
walkdir   = "2"
tar       = "0.4"
flate2    = "1"
bzip2     = "0.4"
xz2       = { version = "0.1", features = ["static"] }
zstd      = { version = "0.13", features = ["zstdmt"] }
# Pinned to the 2.2 line: its API is what this crate is written against.
zip       = { version = "~2.2", default-features = false, features = ["deflate", "bzip2", "zstd", "aes-crypto"] }
sevenz-rust = { version = "0.6", features = ["compress", "aes256"] }
# RAR *extraction* only. Off by default because UnRAR's licence is not OSI-approved.
unrar     = { version = "0.5", optional = true }

[features]
default = []
rar = ["dep:unrar"]
